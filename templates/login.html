<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart KDS - Login</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo-icon" style="margin: 0 auto 15px auto; width: 48px; height: 48px; font-size: 1.5rem;">
                <i class="fa-solid fa-utensils"></i>
            </div>
            <h1>Smart KDS</h1>
            <p id="auth-subtitle">Kitchen Display & POS Optimizer</p>
        </div>

        <div class="auth-tabs">
            <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Sign In</button>
            <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Register</button>
        </div>

        <div id="auth-error-msg" class="auth-error">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span id="error-text">Incorrect credentials</span>
        </div>

        <!-- Login Form -->
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="login-username">Username</label>
                <input type="text" id="login-username" class="form-control" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn-primary">
                <span>Sign In</span>
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
        </form>

        <!-- Register Form (Hidden by default) -->
        <form id="register-form" onsubmit="handleRegister(event)" style="display: none;">
            <div class="form-group">
                <label for="register-username">Username</label>
                <input type="text" id="register-username" class="form-control" placeholder="Create a username" required>
            </div>
            <div class="form-group">
                <label for="register-password">Password</label>
                <input type="password" id="register-password" class="form-control" placeholder="Create a password (min 4 characters)" required>
            </div>
            <div class="form-group">
                <label for="register-role">System Role</label>
                <select id="register-role" class="form-control" required>
                    <option value="" disabled selected>Select your role</option>
                    <option value="Waiter">Waiter (POS Terminal)</option>
                    <option value="Chef">Chef (Kitchen Display)</option>
                    <option value="Admin">Admin (All Access)</option>
                </select>
            </div>
            <button type="submit" class="btn-primary">
                <span>Create Account</span>
                <i class="fa-solid fa-user-plus"></i>
            </button>
        </form>
    </div>

    <script src="/static/js/auth.js"></script>
</body>
</html>
